<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060b18" id="meta-theme-color" />
    <title>Mohamed Mahmoud Studio</title>
    <meta name="description" content="الموقع التعريفي ومعرض المشاريع الشخصية للمطور Mohamed Mahmoud - حلول برمجية ذكية وتطبيقات ويب حديثة" />
    <meta property="og:title" content="Mohamed Mahmoud Studio" />
    <meta property="og:description" content="الموقع التعريفي ومعرض المشاريع الشخصية للمطور Mohamed Mahmoud - حلول برمجية ذكية وتطبيقات ويب حديثة" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mm-studio-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          root.style.colorScheme = theme;
          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#060b18' : '#f8fafc');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#060b18] dark:text-slate-100 antialiased selection:bg-blue-500/25 selection:text-blue-900 dark:selection:bg-cyan-400/30 dark:selection:text-cyan-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
